#cart {
  position: fixed; left: 16px; top: 14px; width: 290px; padding: 12px 14px 12px; pointer-events: none;
  background: radial-gradient(130% 120% at 30% 30%, var(--paper) 55%, rgba(246, 244, 238, 0) 100%);
}

</style>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.29.0/babylon.js"></script>

<script>
// ?theatre=<path.js>: the generated theatre (heights, water, routed roads) from tools/campaign-theatre.ts, by default
// its output under scratch/ at the repository root (git-ignored). Only a .js file of this page's own origin and
// protocol, never a script from another host.
(() => {
  const given = new URLSearchParams(location.search).get('theatre') || '../scratch/campaign-1805' + '.js';
  let url;
  try {
    url = new URL(given, location.href);
  } catch (e) {
    return;
  }
  const sameOrigin = url.protocol === location.protocol && url.host === location.host;
  if (sameOrigin && url.pathname.endsWith('.js') && !/["<>]/.test(url.href)) {
    window.__theatreUrl = url.href;
    document.write('<script src="' + url.href + '"><\/script>');
  } else {
    console.warn('?theatre= ignored: not a .js file of this page\'s origin');
  }
})();
</script>

<body>
<canvas id="c"></canvas>
<canvas id="ink"></canvas>
<div id="cart">
  <h1>The Theatre of 1805</h1>

  <div class="rule"></div>

<div id="missing">No theatre: run <b>node tools/campaign-theatre.ts</b>, then reload.</div>
<script>
/*
 * The campaign map prototype (docs/plans/active/k1-theatre-look.md; the look: docs/proposals/campaign-map.md).
 * The 1805 theatre as a lit relief print: the heights baked into a relief at load (the battle map lit view bake,
 * prototypes/staff-map.html, at a thousand times the scale), on parchment, in a 3D view tilted 20 degrees off straight
 * down (decision 0055). Rivers, roads, towns and names are ink on a 2D canvas above, redrawn when the camera moves.
 *
 * URL (defaults in brackets): ?rz= the heights exaggerated for the light (2); ?sun= the sun height in degrees (38);
 * ?floor= and ?top= the darkest and lightest relief tone against the paper (0.55, 1.3); ?base= flat ground's tone
 * (0.96); ?far= the shade's strength over the whole theatre (0.45, full up close); ?dark= how near the deepest
 * shade comes to a warm black (0.88); ?terrace= the terraces' height in metres (half the contour interval; 0 off);
 * ?detail= the real relief mixed back over them (0.3); ?smooth= the real relief's smoothing in cells (1); ?contour=
 * the contour interval in metres (200); ?view=x,z,km the target in km from the centre, east and north, and the
 * camera distance; ?theatre= the generated file; ?mount= the mountains' extra lift (4; 0 true heights); ?fine=
 * the relief's small detail kept (0.5); ?rise= the map's 3D rise per km of those heights (1.5; 0 flat);
 * ?mountlight= the milder lift the light reads (1.5).
 */
'use strict';
const t0 = performance.now();
const Q = new URLSearchParams(location.search);
const B = BABYLON;
const T = window.THEATRE;
const D = window.CAMPAIGN_1805;

/* =========================================================================
   SMALL HELPERS
   ========================================================================= */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;

/** Smoothstep from a to b. */
function sstep(a, b, x) {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

/** A repeatable pseudo-random number in [0, 1) for a pair of numbers. */
function hash(x, y) {
  const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return h - Math.floor(h);
}

/** A seeded generator of numbers in [0, 1). */
function mulberry(seed) {
  let a = seed;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** '#rrggbb' to [r, g, b] in 0..1. */
function hex(c) {
  const n = parseInt(c.slice(1), 16);
  return [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

/**
 * Why the generated theatre cannot be drawn with the data file, or '' when it can: missing, or older than the data
 * file (a town or region it has no position for).
 */
function theatreProblem() {
  if (!T || !D) return 'No theatre';
  const unplaced = D.towns.filter(t => !T.towns?.[t.id]);
  if (unplaced.length || T.regions?.length !== D.regions.length) return 'The theatre is older than the data file';
  return '';
}
if (theatreProblem()) {
  const missing = document.getElementById('missing');
  missing.firstChild.textContent = theatreProblem() + ': run ';
  missing.style.display = 'grid';
  throw new Error('campaign map: ' + theatreProblem());
}

/* =========================================================================
   THE THEATRE: the frame, its projection, the heights
   ========================================================================= */
const { lat0, lon0, halfX, halfZ } = T.frame;
const CELL = T.cell;
const NX = T.nx;
const NZ = T.nz;
/**
 * A number from the URL, clamped to [lo, hi], or `fallback` when absent or not a number. A given 0 is kept (within
 * the range), unlike `Number(q) || fallback`.
 */
function param(name, fallback, lo, hi) {
  const v = Q.has(name) ? Number(Q.get(name)) : NaN;
  return Number.isFinite(v) ? clamp(v, lo, hi) : fallback;
}

// the light's exaggeration of the heights (0 flattens the relief), and the sun's height in degrees
const RELIEF_Z = param('rz', 2, 0, 20);
const RELIEF_SUN = param('sun', 38, 2, 85);
// the relief tone on the paper: no darker than SHADE_FLOOR, no lighter than SHADE_TOP; both kept off 1, which the
// shader's soft knee divides by
const SHADE_FLOOR = param('floor', 0.55, 0.3, 0.97);
const SHADE_TOP = param('top', 1.3, 1.02, 1.8);
// how far the deepest shade goes toward the warm black ink (1: all the way)
const SHADE_DARK = param('dark', 0.88, 0, 1);
// flat ground's tone against the paper: below 1, so the lit slopes have room to rise to near white above it
const SHADE_BASE = param('base', 0.96, 0.5, 1);
// the shade's strength at the theatre's zoom, rising to full as the camera closes in
const SHADE_FAR = param('far', 0.45, 0, 1);
// the light from the north-west, as on the battle map: x east, z north
const NW = [-Math.SQRT1_2, Math.SQRT1_2];

/** The heights in metres, the south row first, decoded from the generated file. */
function decodeHeights() {
  const text = atob(T.h);
  const bytes = new Uint8Array(text.length);
  for (let k = 0; k < text.length; k++) bytes[k] = text.charCodeAt(k);
  const h16 = new Int16Array(bytes.buffer);
  if (h16.length !== NX * NZ) {
    throw new Error('theatre heights: ' + h16.length + ' values, expected ' + NX * NZ);
  }
  return despiked(h16, NX, NZ);
}

/**
 * The grid with its single-node spikes and pits removed: each node clamped to the range of its eight neighbours.
 * The terrain tiles hold thousands of nodes standing 15 m and more above (or below) all their neighbours; lit per
 * pixel, each one drew a dark dot. Edge nodes are kept.
 */
function despiked(h, nx, nz) {
  const out = Float32Array.from(h);
  for (let j = 1; j < nz - 1; j++) {
    for (let i = 1; i < nx - 1; i++) {
      const k = j * nx + i;
      let lo = Infinity;
      let hi = -Infinity;
      for (const o of [-1, 1, -nx, nx, -nx - 1, -nx + 1, nx - 1, nx + 1]) {
        lo = Math.min(lo, h[k + o]);
        hi = Math.max(hi, h[k + o]);
      }
      out[k] = clamp(h[k], lo, hi);
    }
  }
  return out;
}

/** Box mean of a grid over a square of half-width r cells, by a summed-area table (edges clamped). */
function boxMean(h, nx, nz, r) {
  const S = new Float64Array((nx + 1) * (nz + 1));
  for (let j = 0; j < nz; j++) {
    let row = 0;
    for (let i = 0; i < nx; i++) {
      row += h[j * nx + i];
      S[(j + 1) * (nx + 1) + i + 1] = S[j * (nx + 1) + i + 1] + row;
    }
  }
  const out = new Float32Array(nx * nz);
  for (let j = 0; j < nz; j++) {
    const j0 = Math.max(0, j - r);
    const j1 = Math.min(nz, j + r + 1);
    for (let i = 0; i < nx; i++) {
      const i0 = Math.max(0, i - r);
      const i1 = Math.min(nx, i + r + 1);
      const sum = S[j1 * (nx + 1) + i1] - S[j0 * (nx + 1) + i1] - S[j1 * (nx + 1) + i0] + S[j0 * (nx + 1) + i0];
      out[j * nx + i] = sum / ((i1 - i0) * (j1 - j0));
    }
  }
  return out;
}

// the slope light is stored over LAMBERT_RANGE (1 on flat ground), wide enough that steep alpine slopes do not clip
const LAMBERT_RANGE = [0.0, 1.8];
// the cast shadow softens over this many metres of true height under the shadow line
const RELIEF_SOFT = 120;
// the slope light reads heights smoothed over a square of half-width SMOOTH cells (a first simplification: small
// hills fade, large forms stay); the contours read heights smoothed over CONTOUR_SMOOTH cells, so they run as
// generalised lines
const SMOOTH = Math.round(param('smooth', 1, 0, 12));
const CONTOUR_SMOOTH = 3;
// the contours: one every CONTOUR m, an index line every CONTOUR_INDEX lines
const CONTOUR = param('contour', 200, 25, 2000);
const CONTOUR_INDEX = 5;
// the terraces: the light reads heights snapped into bands TERRACE m tall (every height in a band lifted to its
// floor, so low ground goes flat and the relief reads as stacked layers); half the contour interval, from heights
// smoothed less than the contours', so the contour lines do not always sit on a terrace's bank; DETAIL of the
// smoothed real heights is mixed back so a terrace is not a bare plateau. ?terrace=0 turns them off
const TERRACE = param('terrace', 0, 0, 2000);
// the contour sheets drawn per pixel, SHEET m apart (the contour interval: every step has its ink line), each
// with a lit rim toward the light and a shadow under the sheet above. Off by default (the owner: they read as
// shadows cast by the contour lines); ?sheet=200 to compare
const SHEET = param('sheet', 0, 0, 2000);
// the cast shadow is thrown by the large forms only: heights averaged over a square of half-width CAST_SMOOTH cells
const CAST_SMOOTH = 6;
// the plate's thickness in km, and the camera's tilt off straight down, in degrees, far and at the closest zoom
const THICK = 8;
const TILT_FAR = 20;
const TILT_NEAR = param('tilt', 40, 0, 55);
// the cloud shadows drifting over the map: how dark (0 off)
const CLOUDS = param('clouds', 0.12, 0, 0.5);
// how much of the real relief's detail the light gets back up close
const DETAIL_GAIN = param('crisp', 0.8, 0, 1.5);
const TERRACE_SMOOTH = 1;
const DETAIL = param('detail', 0.3, 0, 1);
// representative mountains, as a campaign map draws them: the relief's large-scale shape (heights averaged over a
// square of half-width BIG_R cells, about 6 km across) kept whole and its smaller detail scaled by FINE, then the
// heights above the lowlands lifted by up to MOUNT times more where the wider region (MOUNT_R cells) stands high:
// the plains stay flat, the Alps tower and throw long shadows
const BIG_R = 12;
const FINE = param('fine', 0.5, 0, 1);
const MOUNT = param('mount', 4, 0, 12);
// the light reads a milder lift than the 3D shape: lifted as much, the cast shadows would swallow the valleys
const MOUNT_LIGHT = param('mountlight', 1.5, 0, 12);
// the map raised in 3D by the same representative heights, RISE km of map for each km of them, smoothed over
// DISP_SMOOTH cells (the mesh has a vertex about every km), fading to flat over the last RISE_EDGE km to the plate's
// edge so the map still lies on its table
const RISE = param('rise', 1.5, 0, 6);
const DISP_SMOOTH = 2;
const RISE_EDGE = 12;
const MOUNT_R = 24;
const MOUNT_FROM = 500;
const MOUNT_TO = 1600;

/**
 * The heights the light reads: the relief made representative (its large-scale shape whole, its detail scaled by
 * FINE), terraced (smoothed over TERRACE_SMOOTH cells and snapped down to its TERRACE band, each step softened over a
 * cell either side so it is a steep bank rather than a cliff, with DETAIL of it smoothed over SMOOTH cells mixed back
 * in; without terraces, the smoothed heights alone); `lifted` then raises it where the region stands high.
 */
function terraced(h0) {
  const big = boxMean(h0, NX, NZ, BIG_R);
  const equalised = new Float32Array(h0.length);
  for (let k = 0; k < h0.length; k++) equalised[k] = big[k] + (h0[k] - big[k]) * FINE;
  return terracedFrom(equalised);
}

/**
 * The heights above the lowlands lifted by 1 + gain · how high the wider region stands (from MOUNT_FROM to MOUNT_TO
 * m, smoothly), so a mountain range rises as a mass while the plains stay as they are.
 */
function lifted(h, h0, gain) {
  if (!gain) return h;
  const region = boxMean(h0, NX, NZ, MOUNT_R);
  let low = Infinity;
  for (const v of h0) low = Math.min(low, v);
  const out = new Float32Array(h.length);
  for (let k = 0; k < h.length; k++) out[k] = low + (h[k] - low) * (1 + gain * sstep(MOUNT_FROM, MOUNT_TO, region[k]));
  return out;
}

/** The terraced heights of `h0` (see `terraced`): bands of TERRACE m, DETAIL of the smoothed heights mixed back. */
function terracedFrom(h0) {
  const detail = SMOOTH ? boxMean(h0, NX, NZ, SMOOTH) : h0;
  if (!TERRACE) return detail;
  const field = boxMean(h0, NX, NZ, TERRACE_SMOOTH);
  const bands = new Float32Array(h0.length);
  for (let k = 0; k < bands.length; k++) bands[k] = Math.floor(field[k] / TERRACE) * TERRACE;
  const steps = boxMean(bands, NX, NZ, 1);
  const out = new Float32Array(h0.length);
  for (let k = 0; k < out.length; k++) out[k] = steps[k] * (1 - DETAIL) + detail[k] * DETAIL;
  return out;
}

/**
 * The shaded relief, baked once at load into RGBA bytes (`bytes`) the size of the grid, with the heights the light read
 * before their lift (`base`), the south row first: R the slope light
 * (Lambert over LAMBERT_RANGE), G the cast shadow (1 lit, 0 in shadow), B the exposure (0.5 even, lower in valleys,
 * higher on crests). The battle map bake (prototypes/staff-map.html, bakeRelief) at the theatre scale.
 *
 * Cast shadow, in one pass: walking from the light, each node carries the highest shadow line reaching it (the line
 * of its neighbour toward the light, dropped by the sun slope over one step, or its own height). On this grid the
 * north-west neighbour is (i - 1, j + 1), so the walk goes north to south, west to east.
 */
function bakeRelief(h0) {
  const base = terraced(h0);
  const shaped = lifted(base, h0, MOUNT_LIGHT);
  const h = new Float32Array(h0.length);
  for (let k = 0; k < h.length; k++) h[k] = shaped[k] * RELIEF_Z;
  const el = (RELIEF_SUN * Math.PI) / 180;
  const drop = CELL * Math.SQRT2 * Math.tan(el);
  const L = [NW[0] * Math.cos(el), Math.sin(el), NW[1] * Math.cos(el)];

  // the cast shadow from the large forms
  const castH = boxMean(h, NX, NZ, CAST_SMOOTH);
  const lit = new Float32Array(NX * NZ);
  const line = new Float32Array(NX * NZ);
  for (let j = NZ - 1; j >= 0; j--) {
    for (let i = 0; i < NX; i++) {
      const k = j * NX + i;
      const fromLight = i > 0 && j < NZ - 1 ? line[(j + 1) * NX + i - 1] - drop : -Infinity;
      line[k] = Math.max(castH[k], fromLight);
      lit[k] = 1 - sstep(0, 1, (fromLight - castH[k]) / (RELIEF_SOFT * Math.max(RELIEF_Z, 0.01)));
    }
  }

  // exposure: how far a node stands above or below its surroundings, near (about 1.5 km) and wide (about 6 km)
  const near = boxMean(shaped, NX, NZ, 6);
  const wide = boxMean(shaped, NX, NZ, 24);

  const out = new Uint8Array(NX * NZ * 4);
  for (let j = 0; j < NZ; j++) {
    for (let i = 0; i < NX; i++) {
      const k = j * NX + i;
      const gx = (h[j * NX + Math.min(NX - 1, i + 1)] - h[j * NX + Math.max(0, i - 1)]) / (2 * CELL);
      const gz = (h[Math.min(NZ - 1, j + 1) * NX + i] - h[Math.max(0, j - 1) * NX + i]) / (2 * CELL);
      const nl = Math.hypot(gx, 1, gz);
      const lambert = Math.max(0, (-gx * L[0] + L[1] - gz * L[2]) / nl) / L[1];
      const exposed = 0.5 - ((near[k] - shaped[k]) * 0.0007 + (wide[k] - shaped[k]) * 0.00025);
      const o = k * 4;
      out[o] = Math.round(clamp((lambert - LAMBERT_RANGE[0]) / (LAMBERT_RANGE[1] - LAMBERT_RANGE[0]), 0, 1) * 255);
      out[o + 1] = Math.round(lit[k] * 255);
      out[o + 2] = Math.round(clamp(exposed, 0, 1) * 255);
      out[o + 3] = 255;
    }
  }
  return { bytes: out, base, shaped };
}

/**
 * The lakes as a mask over the frame, two texels a cell where the GPU allows it (sharper shores than the heights),
 * else one; the south row first: 255 in the water, antialiased at the shore so the shader can find the bank. Its
 * texels tile the frame from edge to edge. Returns the bytes and their size.
 */
function bakeLakes(maxTextureSize) {
  const res = Math.max(NX, NZ) * 2 <= maxTextureSize ? 2 : 1;
  const w = (NX - 1) * res;
  const h = (NZ - 1) * res;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  // canvas row 0 is the south edge: world (x, z) to pixel ((x + halfX), (z + halfZ)) · res / CELL
  const scale = res / CELL;
  g.setTransform(scale, 0, 0, scale, halfX * scale, halfZ * scale);
  g.fillStyle = '#fff';
  for (const ring of T.lakes) {
    g.beginPath();
    for (let k = 0; k < ring.length; k += 2) g.lineTo(ring[k], ring[k + 1]);
    g.closePath();
    g.fill();
  }
  const rgba = g.getImageData(0, 0, w, h).data;
  const data = new Uint8Array(w * h);
  for (let k = 0; k < data.length; k++) data[k] = rgba[k * 4];
  return { data, w, h };
}

/** A tileable paper grain: mottling, fibres and specks around mid grey (the shader colours it). */
function paperCanvas() {
  const N = 1024;
  const P = 16;
  const c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  const im = g.createImageData(N, N);
  // periodic value noise on a P × P lattice
  const noise = (x, y) => {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const u = (x - xi) * (x - xi) * (3 - 2 * (x - xi));
    const v = (y - yi) * (y - yi) * (3 - 2 * (y - yi));
    const at = (a, b) => hash(((a % P) + P) % P, ((b % P) + P) % P);
    const a = at(xi, yi);
    const b = at(xi + 1, yi);
    const cc = at(xi, yi + 1);
    const d = at(xi + 1, yi + 1);
    return a + (b - a) * u + (cc - a) * v + (a - b - cc + d) * u * v;
  };
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const u = (x / N) * P;
      const w = (y / N) * P;
      const v = 0.55 * noise(u, w) + 0.3 * (noise(u * 2 + 0.5, w * 2) % 1) + 0.15 * hash(x, y);
      const i = (y * N + x) * 4;
      im.data[i] = im.data[i + 1] = im.data[i + 2] = 96 + v * 64;
      im.data[i + 3] = 255;
    }
  }
  g.putImageData(im, 0, 0);
  const R = mulberry(9);
  for (let k = 0; k < 2600; k++) {
    const x = R() * N;
    const y = R() * N;
    const a = R() * 6.28;
    const l = 6 + R() * 26;
    const dark = R() < 0.5;
    g.strokeStyle = dark ? `rgba(40,40,40,${0.08 + R() * 0.1})` : `rgba(255,255,255,${0.1 + R() * 0.12})`;
    g.lineWidth = 0.5 + R() * 0.6;
    for (const ox of [-N, 0, N]) {
      for (const oy of [-N, 0, N]) {
        g.beginPath();
        g.moveTo(x + ox, y + oy);
        const cx = x + ox + Math.cos(a + 0.6) * l * 0.5;
        const cy = y + oy + Math.sin(a + 0.6) * l * 0.5;
        g.quadraticCurveTo(cx, cy, x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l);
        g.stroke();
      }
    }
  }
  for (let k = 0; k < 2400; k++) {
    g.fillStyle = `rgba(30,30,30,${0.06 + R() * 0.16})`;
    g.beginPath();
    g.arc(R() * N, R() * N, 0.4 + R() * 0.9, 0, 6.28);
    g.fill();
  }
  return c;
}

/* =========================================================================
   THE PRINT: one plane in km, the map in the middle and the table around it
   ========================================================================= */
const canvas = document.getElementById('c');
const GL_DPR = Math.min(2, window.devicePixelRatio || 1);
const engine = new B.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: false }, false);
engine.setHardwareScalingLevel(1 / GL_DPR);
const scene = new B.Scene(engine);
scene.clearColor = new B.Color4(0.84, 0.81, 0.75, 1);
scene.skipPointerMovePicking = true;

const MAP_W = (2 * halfX) / 1000;
const MAP_H = (2 * halfZ) / 1000;
// the table runs this far past the map on every side, in km
const TABLE = 900;

B.Effect.ShadersStore.printVertexShader = `
precision highp float;
attribute vec3 position;
uniform mat4 worldViewProjection;
uniform sampler2D uDisp;
uniform vec2 uHalf, uTexel;
uniform float uCellKm, uRise, uEdge;
varying vec2 vW;
void main() {
  vW = position.xz;
  /* raised by the representative heights, flat at the plate edge and on the table beyond it */
  vec2 uv = ((position.xz + uHalf) / uCellKm + 0.5) * uTexel;
  float fade = smoothstep(0.0, uEdge, min(uHalf.x - abs(position.x), uHalf.y - abs(position.z)));
  float y = position.y + texture2D(uDisp, uv).r / 1000.0 * uRise * fade;
  gl_Position = worldViewProjection * vec4(position.x, y, position.z, 1.0);
}`;

B.Effect.ShadersStore.printFragmentShader = `
precision highp float;
varying vec2 vW;
uniform sampler2D uRelief, uLakes, uPaperT, uHeight, uLightH, uLightD, uRealH, uFine0, uFine1, uFine2, uClouds;
uniform vec2 uHalf, uTexel, uLakeTexel, uLightXZ, uFineTexel0, uFineTexel1, uFineTexel2;
uniform vec4 uFineRect0, uFineRect1, uFineRect2;
uniform vec3 uSun;
uniform float uCellKm, uFineCellKm, uRZ, uFineK, uNearK, uDetailK, uSheetK, uContourK, uSheet;
uniform float uTime, uCloudK, uHaze, uScreenH;
uniform vec3 uPaper, uTable, uWater, uShadowInk, uHighlight;
uniform float uFloor, uTop, uContour, uDark, uBase, uShadeK;

float rectDist(vec2 p, vec2 extent) {
  vec2 d = abs(p) - extent;
  return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
}

/* the frame grid: node i at the centre of texel i */
vec2 gridUv(vec2 w) {
  return ((w + uHalf) / uCellKm + 0.5) * uTexel;
}

/* a smooth cubic B-spline read of all four channels, from four bilinear taps */
vec4 bicubic4(sampler2D t, vec2 uv, vec2 texel) {
  vec2 p = uv / texel - 0.5;
  vec2 f = fract(p);
  p = floor(p);
  vec2 w0 = (1.0 - f) * (1.0 - f) * (1.0 - f) / 6.0;
  vec2 w1 = (3.0 * f * f * f - 6.0 * f * f + 4.0) / 6.0;
  vec2 w3 = f * f * f / 6.0;
  vec2 w2 = 1.0 - w0 - w1 - w3;
  vec2 g0 = w0 + w1;
  vec2 g1 = w2 + w3;
  vec2 a = (p - 1.0 + w1 / g0 + 0.5) * texel;
  vec2 b = (p + 1.0 + w3 / g1 + 0.5) * texel;
  return g0.y * (g0.x * texture2D(t, vec2(a.x, a.y)) + g1.x * texture2D(t, vec2(b.x, a.y)))
       + g1.y * (g0.x * texture2D(t, vec2(a.x, b.y)) + g1.x * texture2D(t, vec2(b.x, b.y)));
}

/* a smooth cubic B-spline read of a single-channel texture, from four bilinear taps */
float bicubic(sampler2D t, vec2 uv, vec2 texel) {
  vec2 p = uv / texel - 0.5;
  vec2 f = fract(p);
  p = floor(p);
  vec2 w0 = (1.0 - f) * (1.0 - f) * (1.0 - f) / 6.0;
  vec2 w1 = (3.0 * f * f * f - 6.0 * f * f + 4.0) / 6.0;
  vec2 w3 = f * f * f / 6.0;
  vec2 w2 = 1.0 - w0 - w1 - w3;
  vec2 g0 = w0 + w1;
  vec2 g1 = w2 + w3;
  vec2 a = (p - 1.0 + w1 / g0 + 0.5) * texel;
  vec2 b = (p + 1.0 + w3 / g1 + 0.5) * texel;
  return g0.y * (g0.x * texture2D(t, vec2(a.x, a.y)).r + g1.x * texture2D(t, vec2(b.x, a.y)).r)
       + g1.y * (g0.x * texture2D(t, vec2(a.x, b.y)).r + g1.x * texture2D(t, vec2(b.x, b.y)).r);
}

/* a Catmull-Rom read of a single-channel texture: it passes through the texels (a B-spline blurs them by about half a
   texel), sixteen taps at texel centres */
float catmullRom(sampler2D t, vec2 uv, vec2 texel) {
  vec2 p = uv / texel - 0.5;
  vec2 f = fract(p);
  vec2 base = (floor(p) + 0.5) * texel;
  vec2 f2 = f * f;
  vec2 f3 = f2 * f;
  vec2 w0 = -0.5 * f3 + f2 - 0.5 * f;
  vec2 w1 = 1.5 * f3 - 2.5 * f2 + 1.0;
  vec2 w2 = -1.5 * f3 + 2.0 * f2 + 0.5 * f;
  vec2 w3 = 0.5 * f3 - 0.5 * f2;
  float sum = 0.0;
  for (int j = 0; j < 4; j++) {
    float wy = j == 0 ? w0.y : j == 1 ? w1.y : j == 2 ? w2.y : w3.y;
    float y = base.y + float(j - 1) * texel.y;
    float row = w0.x * texture2D(t, vec2(base.x - texel.x, y)).r + w1.x * texture2D(t, vec2(base.x, y)).r;
    row += w2.x * texture2D(t, vec2(base.x + texel.x, y)).r + w3.x * texture2D(t, vec2(base.x + 2.0 * texel.x, y)).r;
    sum += wy * row;
  }
  return sum;
}

/* the finer heights minus the coarse ones, in metres, inside a window (x0, z0, x1, z1 in km), faded at its edge */
float fineIn(sampler2D t, vec4 rect, vec2 texel, vec2 w) {
  float edge = min(min(w.x - rect.x, rect.z - w.x), min(w.y - rect.y, rect.w - w.y));
  if (edge <= 0.0) return 0.0;
  vec2 uv = ((w - rect.xy) / uFineCellKm + 0.5) * texel;
  return texture2D(t, uv).r * smoothstep(0.0, 4.0, edge);
}

float fineDetail(vec2 w) {
  return (fineIn(uFine0, uFineRect0, uFineTexel0, w) + fineIn(uFine1, uFineRect1, uFineTexel1, w) +
          fineIn(uFine2, uFineRect2, uFineTexel2, w)) * uFineK;
}

/* the heights the light reads (representative, metres), exaggerated by uRZ */
float lightH(vec2 w) {
  return catmullRom(uLightH, gridUv(w), uTexel);
}

/* up close, the real detail the simplification removed and the finer windows' detail: lit at its true slope */
float detailH(vec2 w) {
  float h = uDetailK > 0.0 ? uDetailK * catmullRom(uLightD, gridUv(w), uTexel) : 0.0;
  return h + fineDetail(w);
}

/* the heights the contours and sheets read: generalised far, the real ones (and the finer detail) up close */
float contourH(vec2 w) {
  float generalised = texture2D(uHeight, gridUv(w)).r;
  if (uNearK <= 0.0) return generalised;
  return mix(generalised, bicubic(uRealH, gridUv(w), uTexel) + fineDetail(w), uNearK);
}

void main() {
  vec2 uv = gridUv(vW);
  float g1 = texture2D(uPaperT, vW / 3.0).r;
  float g2 = texture2D(uPaperT, vW / 31.0 + 0.37).r;
  float g3 = texture2D(uPaperT, vW / 170.0 + 0.71).r;
  float grain = 0.93 + (g1 - 0.5) * 0.2 + (g2 - 0.5) * 0.12 + (g3 - 0.5) * 0.07;
  float haze = uHaze * smoothstep(0.45, 1.0, gl_FragCoord.y / uScreenH);

  float d = rectDist(vW, uHalf);
  if (d > 0.0) {
    /* the table, and the thick plate shadow thrown to the south-east */
    float sd = rectDist(vW - vec2(14.0, -14.0), uHalf);
    float shadow = 1.0 - smoothstep(-10.0, 34.0, sd);
    vec3 table = uTable * (0.97 + (g2 - 0.5) * 0.08 + (g3 - 0.5) * 0.06);
    table *= 1.0 - 0.38 * shadow;
    gl_FragColor = vec4(mix(table, uTable, haze), 1.0);
    return;
  }

  vec3 paper = uPaper * grain;
  /* a thin worn border inside the neatline */
  paper *= mix(vec3(0.9, 0.85, 0.75), vec3(1.0), smoothstep(0.6, 3.0, -d));

  /* the light per pixel: the slope of the representative heights (a smooth cubic read, with the finer detail up
     close), the cast shadow of the large forms and the exposure baked */
  float px = max(length(fwidth(vW)), 1e-4);
  float e = max(px, mix(0.5 * uCellKm, 0.5 * uFineCellKm, uFineK));
  vec2 ex = vec2(e, 0.0);
  vec2 ez = vec2(0.0, e);
  float hx = (lightH(vW + ex) - lightH(vW - ex)) * uRZ + (detailH(vW + ex) - detailH(vW - ex));
  float hz = (lightH(vW + ez) - lightH(vW - ez)) * uRZ + (detailH(vW + ez) - detailH(vW - ez));
  vec3 n = normalize(vec3(-hx, 2000.0 * e, -hz));
  float lambert = max(0.0, dot(n, uSun)) / uSun.y;
  /* the baked cast shadow and exposure, read smoothly: bilinear, the shadow edges stepped along the 250 m grid */
  vec3 R = bicubic4(uRelief, uv, uTexel).rgb;
  float sunlit = R.g;
  float exposed = R.b * 2.0 - 1.0;
  float v = lambert * mix(0.6, 1.0, sunlit) * (1.0 + 0.3 * exposed);
  /* a soft knee toward the floor and the top: steep ground keeps its gradation instead of a flat tone */
  float dv = v - 1.0;
  v = dv < 0.0 ? 1.0 - (1.0 - uFloor) * (1.0 - exp(dv / (1.0 - uFloor)))
               : 1.0 + (uTop - 1.0) * (1.0 - exp(-dv / (uTop - 1.0)));
  /* flat ground a mid tone of the paper; the shade runs from it to a warm black ink, the lit slopes up to near white */
  vec3 base = paper * uBase;
  float shade = pow(clamp((1.0 - v) / (1.0 - uFloor), 0.0, 1.0), 1.15);
  float light = pow(clamp((v - 1.0) / (uTop - 1.0), 0.0, 1.0), 0.8);
  vec3 col = v < 1.0 ? mix(base, uShadowInk, shade * uDark * uShadeK) : mix(base, uHighlight, light);

  /* the contour sheets, per pixel at any zoom: a pixel whose ground toward the light lies on a lower sheet is on the
     lit rim of its own; one whose ground toward the light lies on a higher sheet is in that sheet's shadow */
  float hc = contourH(vW);
  if (uSheet > 0.0) {
    float sheet = floor(hc / uSheet);
    float crowd = (1.0 - smoothstep(0.05, 0.14, fwidth(hc / uSheet))) * uSheetK;
    float rim = floor(contourH(vW + uLightXZ * 1.5 * px) / uSheet);
    float over = floor(contourH(vW + uLightXZ * 3.0 * px) / uSheet);
    if (over > sheet) col *= 1.0 - 0.16 * crowd;
    else if (rim < sheet) col = mix(col, uHighlight, 0.45 * crowd);
  }

  /* contours: a thin line every uContour metres, a stronger index line every fifth, in dark ink; each fades where its
     lines would crowd on screen */
  float f1 = hc / uContour;
  float f5 = f1 / ${CONTOUR_INDEX.toFixed(1)};
  float w1 = fwidth(f1);
  float w5 = fwidth(f5);
  float l1 = 1.0 - smoothstep(0.5, 1.3, abs(fract(f1 + 0.5) - 0.5) / max(w1, 1e-5));
  float l5 = 1.0 - smoothstep(0.6, 1.5, abs(fract(f5 + 0.5) - 0.5) / max(w5, 1e-5));
  l1 *= 1.0 - smoothstep(0.06, 0.16, w1);
  l5 *= 1.0 - smoothstep(0.08, 0.2, w5);
  /* far out only the index lines, fainter: half-faded lines on steep uplands read as crumbs */
  col = mix(col, vec3(0.2, 0.16, 0.12), max(0.45 * l1 * uContourK, mix(0.3, 0.75, uContourK) * l5));

  /* lakes: a flat wash sunk below the shore, the bank toward the light shading the water */
  vec2 luv = (vW + uHalf) / (2.0 * uHalf);
  vec2 lx = vec2(uLakeTexel.x, 0.0);
  vec2 lz = vec2(0.0, uLakeTexel.y);
  /* a smooth cubic read, so the 125 m mask does not show its steps up close */
  float w = bicubic(uLakes, luv, uLakeTexel);
  if (w > 0.01) {
    vec2 gW = vec2(texture2D(uLakes, luv + lx).r - texture2D(uLakes, luv - lx).r,
                   texture2D(uLakes, luv + lz).r - texture2D(uLakes, luv - lz).r);
    vec2 nw = gW / max(length(gW), 1e-4);
    float bank = smoothstep(0.02, 0.3, length(gW));
    vec3 wash = mix(paper, uWater, 0.88);
    wash *= 1.0 - 0.3 * clamp(dot(nw, -uLightXZ), 0.0, 1.0) * bank;
    col = mix(col, wash, smoothstep(0.15, 0.6, w));
  }

  /* cloud shadows drifting slowly from the west */
  /* two scales, crossed, so the tile never repeats visibly */
  float cloud = texture2D(uClouds, vW / 310.0 + uTime * vec2(0.0005, 0.00015)).r *
                texture2D(uClouds, vW / 170.0 + vec2(0.37, 0.61) + uTime * vec2(0.0007, 0.0002)).r;
  col *= 1.0 - uCloudK * smoothstep(0.3, 0.55, cloud);

  /* haze toward the top of the view, as the camera tilts up close */
  gl_FragColor = vec4(mix(col, uPaper * 0.97, haze), 1.0);
}`;

/* the plate's sides: paper lit by the map's one light, darker below */
B.Effect.ShadersStore.sideVertexShader = `
precision highp float;
attribute vec3 position;
attribute vec3 normal;
uniform mat4 worldViewProjection;
varying vec3 vN;
varying float vY;
void main() {
  vN = normal;
  vY = position.y;
  gl_Position = worldViewProjection * vec4(position, 1.0);
}`;

B.Effect.ShadersStore.sideFragmentShader = `
precision highp float;
varying vec3 vN;
varying float vY;
uniform vec3 uPaper;
uniform vec2 uLightXZ;
uniform float uThick;
void main() {
  float lit = 0.62 + 0.38 * max(0.0, dot(normalize(vN.xz + 1e-5), uLightXZ));
  float low = mix(0.82, 1.0, clamp(vY / uThick + 1.0, 0.0, 1.0));
  /* the top face lies just under the map's edge: paper, so it never shows as specks where they meet */
  gl_FragColor = vec4(vN.y > 0.5 ? uPaper : uPaper * lit * low, 1.0);
}`;

// one float's bits, shared by every call of toHalf (allocating per value cost seconds over the grid)
const HALF_F32 = new Float32Array(1);
const HALF_U32 = new Uint32Array(HALF_F32.buffer);

/** A number as the bits of a half float (IEEE 754 binary16), rounded to nearest; heights of a few km lose under 2 m. */
function toHalf(v) {
  HALF_F32[0] = v;
  const x = HALF_U32[0];
  const sign = (x >>> 16) & 0x8000;
  const exp = ((x >>> 23) & 0xff) - 127 + 15;
  const mant = x & 0x7fffff;
  if (exp <= 0) return sign;
  if (exp >= 31) return sign | 0x7c00;
  // added, not or-ed: a mantissa rounding up to 1024 carries into the exponent (or-ed, 511.9 m read as 256)
  return sign | ((exp << 10) + ((mant + 0x1000) >> 13));
}

/**
 * The contour field (heights smoothed over CONTOUR_SMOOTH cells), as a half-float single-channel texture for the
 * contours: 8 bits
 * would step every 16 m over the theatre's 4 km and draw the lines in stairs. Bilinear, no mips (half floats are not
 * always renderable, which mip generation needs); the contour lines fade by their own screen density instead.
 */
function contourTexture(smooth) {
  const half = new Uint16Array(smooth.length);
  for (let k = 0; k < half.length; k++) half[k] = toHalf(smooth[k]);
  const t = B.RawTexture.CreateRTexture(
    half, NX, NZ, scene, false, false, B.Texture.BILINEAR_SAMPLINGMODE, B.Engine.TEXTURETYPE_HALF_FLOAT,
  );
  t.wrapU = t.wrapV = B.Texture.CLAMP_ADDRESSMODE;
  return t;
}

/** How far the map rises above the plate, in metres of representative height above the lowest, smoothed. */
function displacement(shaped) {
  let low = Infinity;
  for (const v of shaped) low = Math.min(low, v);
  const above = new Float32Array(shaped.length);
  for (let k = 0; k < above.length; k++) above[k] = shaped[k] - low;
  return boxMean(above, NX, NZ, DISP_SMOOTH);
}

/**
 * The detail the simplification removed: the real heights minus their simplified form (before any lift), scaled by
 * DETAIL_GAIN. Not lifted: lifted, and exaggerated for the light on top, it turned every alpine slope black or white.
 */
function lightDetail(h0, base) {
  const out = new Float32Array(h0.length);
  for (let k = 0; k < out.length; k++) out[k] = (h0[k] - base[k]) * DETAIL_GAIN;
  return out;
}

/** Heights in metres as a float single-channel texture (bilinear, clamped, no mips: see contourTexture). */
function halfTexture(values, w, h) {
  // 32-bit floats where the GPU filters them: the light's heights are lifted to about 10 km, where a half float steps
  // every 8 m and the light draws the steps as rows of dots
  if (engine.getCaps().textureFloatLinearFiltering) {
    const t = B.RawTexture.CreateRTexture(
      Float32Array.from(values), w, h, scene, false, false, B.Texture.BILINEAR_SAMPLINGMODE, B.Engine.TEXTURETYPE_FLOAT,
    );
    t.wrapU = t.wrapV = B.Texture.CLAMP_ADDRESSMODE;
    return t;
  }
  const half = new Uint16Array(values.length);
  for (let k = 0; k < half.length; k++) half[k] = toHalf(values[k]);
  const t = B.RawTexture.CreateRTexture(
    half, w, h, scene, false, false, B.Texture.BILINEAR_SAMPLINGMODE, B.Engine.TEXTURETYPE_HALF_FLOAT,
  );
  t.wrapU = t.wrapV = B.Texture.CLAMP_ADDRESSMODE;
  return t;
}

/**
 * A texture read only at its texel centres (by catmullRom in the print shader), switched to nearest sampling: the
 * GPU's bilinear filter rounds the coordinates, so a centre read mixed in a little of a neighbour, and the slope
 * light drew that as specks on steep ground.
 */
function exact(t) {
  t.updateSamplingMode(B.Texture.NEAREST_SAMPLINGMODE);
  return t;
}

/** A tileable soft noise for the cloud shadows: three octaves of periodic value noise, grey in 0..255. */
function cloudCanvas() {
  const N = 256;
  const c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  const im = g.createImageData(N, N);
  const noise = (x, y, P) => {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const u = (x - xi) * (x - xi) * (3 - 2 * (x - xi));
    const v = (y - yi) * (y - yi) * (3 - 2 * (y - yi));
    const at = (a, b) => hash(((a % P) + P) % P + 3.1, ((b % P) + P) % P - 7.7);
    const a = at(xi, yi);
    const b = at(xi + 1, yi);
    const cc = at(xi, yi + 1);
    const d = at(xi + 1, yi + 1);
    return a + (b - a) * u + (cc - a) * v + (a - b - cc + d) * u * v;
  };
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const v = 0.55 * noise((x / N) * 4, (y / N) * 4, 4) + 0.3 * noise((x / N) * 8, (y / N) * 8, 8) +
        0.15 * noise((x / N) * 16, (y / N) * 16, 16);
      const i = (y * N + x) * 4;
      im.data[i] = im.data[i + 1] = im.data[i + 2] = v * 255;
      im.data[i + 3] = 255;
    }
  }
  g.putImageData(im, 0, 0);
  return c;
}

/**
 * The finer heights of a focus window (tools/campaign-theatre.ts) as the detail the coarse grid misses: each fine
 * height minus the coarse heights read bilinearly at its node, in metres, a half-float texture.
 */
function fineDetailTexture(win) {
  const text = atob(win.h);
  const bytes = new Uint8Array(text.length);
  for (let k = 0; k < text.length; k++) bytes[k] = text.charCodeAt(k);
  const fine = despiked(new Int16Array(bytes.buffer), win.nx, win.nz);
  const detail = new Float32Array(win.nx * win.nz);
  for (let j = 0; j < win.nz; j++) {
    const fz = clamp((win.z0 + j * win.cell + halfZ) / CELL, 0, NZ - 1.001);
    const cj = Math.floor(fz);
    const v = fz - cj;
    for (let i = 0; i < win.nx; i++) {
      const fx = clamp((win.x0 + i * win.cell + halfX) / CELL, 0, NX - 1.001);
      const ci = Math.floor(fx);
      const u = fx - ci;
      const k = cj * NX + ci;
      const top = heights[k] * (1 - u) + heights[k + 1] * u;
      const bottom = heights[k + NX] * (1 - u) + heights[k + NX + 1] * u;
      detail[j * win.nx + i] = (fine[j * win.nx + i] - (top * (1 - v) + bottom * v)) * DETAIL_GAIN;
    }
  }
  return halfTexture(detail, win.nx, win.nz);
}

/**
 * How high the map stands at a point (map metres), in km: the displacement read bilinearly, as the vertex shader
 * reads it, times RISE, faded to the plate's edge. The ink is projected at this height so it lies on the raised map.
 */
function riseAt(x, z) {
  const fx = clamp((x + halfX) / CELL, 0, NX - 1.001);
  const fz = clamp((z + halfZ) / CELL, 0, NZ - 1.001);
  const i = Math.floor(fx);
  const j = Math.floor(fz);
  const u = fx - i;
  const v = fz - j;
  const k = j * NX + i;
  const top = DISP[k] * (1 - u) + DISP[k + 1] * u;
  const bottom = DISP[k + NX] * (1 - u) + DISP[k + NX + 1] * u;
  const edge = Math.min(halfX - Math.abs(x), halfZ - Math.abs(z)) / 1000;
  return ((top * (1 - v) + bottom * v) / 1000) * RISE * sstep(0, RISE_EDGE, edge);
}

/** A raw RGBA or single-channel texture, clamped, mipmapped (trilinear), so it does not shimmer when minified. */
function rawTexture(data, w, h, format) {
  const t = new B.RawTexture(data, w, h, format, scene, true, false, B.Texture.TRILINEAR_SAMPLINGMODE);
  t.wrapU = t.wrapV = B.Texture.CLAMP_ADDRESSMODE;
  return t;
}

const heights = decodeHeights();

const tBake = performance.now();
// the heights smoothed for the contours
const contourField = boxMean(heights, NX, NZ, CONTOUR_SMOOTH);
const { bytes: reliefBytes, base: representative, shaped: lightHeights } = bakeRelief(heights);
const DISP = displacement(lifted(representative, heights, MOUNT));
const maxTextureSize = engine.getCaps().maxTextureSize;
if (Math.max(NX, NZ) > maxTextureSize) throw new Error(`the theatre grid (${NX} × ${NZ}) passes this GPU's textures`);
const lakes = bakeLakes(maxTextureSize);
window.__bakeMs = Math.round(performance.now() - tBake);

const PAPER = hex('#f4f1e8');
const material = new B.ShaderMaterial('print', scene, 'print', {
  attributes: ['position'],

/* =========================================================================
   CAMERA: tilted 20 degrees off straight down, north up; pan by drag, zoom to the cursor
   ========================================================================= */
/** The camera's tilt off straight down for a distance (km): TILT_FAR far out, TILT_NEAR at the closest zoom. */
function tiltFor(dist) {
  const t = sstep(Math.log(600), Math.log(DIST_MIN), Math.log(dist));
  return (lerp(TILT_FAR, TILT_NEAR, t) * Math.PI) / 180;
}
const cam = new B.FreeCamera('cam', new B.Vector3(0, 1000, 0), scene);
cam.inputs.clear();
cam.fov = 0.5;
cam.minZ = 1;
cam.maxZ = 20000;
// the target on the map (km, x east, z north) and the camera distance from it (km)
const view = { x: 0, z: 0, dist: 1150 };
const DIST_MIN = 30;
const DIST_MAX = 1300;
(() => {
  const v = (Q.get('view') || '').split(',').map(Number);
  if (v.length === 3 && v.every(Number.isFinite)) Object.assign(view, { x: v[0], z: v[1], dist: v[2] });
})();

/** Places the camera from the view. */
function placeCamera() {
  view.dist = clamp(view.dist, DIST_MIN, DIST_MAX);
  view.x = clamp(view.x, -MAP_W / 2, MAP_W / 2);
  view.z = clamp(view.z, -MAP_H / 2, MAP_H / 2);
  // never inside a mountain: the camera stays well above the raised ground under its target
  view.dist = Math.max(view.dist, (riseAt(view.x * 1000, view.z * 1000) + 15) / Math.cos(tiltFor(view.dist)));
  const tilt = tiltFor(view.dist);
  cam.position.set(view.x, view.dist * Math.cos(tilt), view.z - view.dist * Math.sin(tilt));
  // haze toward the top of the view, as the tilt rises past the far one
  material.setFloat('uHaze', 0.35 * sstep(TILT_FAR, Math.max(TILT_NEAR, TILT_FAR + 1), (tilt * 180) / Math.PI));
  cam.setTarget(new B.Vector3(view.x, 0, view.z));
  dirty = true;
}

/**
 * The point of the map (km) under a screen position (CSS pixels), or null above the horizon. The picking ray takes
 * CSS pixels: Babylon scales them by the hardware scaling level itself.
 */
function groundAt(sx, sy) {
  const ray = scene.createPickingRay(sx, sy, B.Matrix.Identity(), cam);
  if (ray.direction.y >= -1e-6) return null;
  const t = -ray.origin.y / ray.direction.y;
  return [ray.origin.x + ray.direction.x * t, ray.origin.z + ray.direction.z * t];
}

let dirty = true;
let drag = null;
canvas.addEventListener('pointerdown', e => {
  drag = groundAt(e.clientX, e.clientY);
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const now = groundAt(e.clientX, e.clientY);
  if (!now) return;
  view.x += drag[0] - now[0];
  view.z += drag[1] - now[1];
  placeCamera();
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  canvas.addEventListener(type, () => {
    drag = null;
  });
}
canvas.addEventListener(
  'wheel',
  e => {
    e.preventDefault();
    const before = groundAt(e.clientX, e.clientY);
    view.dist *= Math.exp(e.deltaY * 0.0012);
    placeCamera();
    scene.updateTransformMatrix(true);
    const after = groundAt(e.clientX, e.clientY);
    if (before && after) {
      view.x += before[0] - after[0];
      view.z += before[1] - after[1];
      placeCamera();
    }
  },
  { passive: false },
);
addEventListener('resize', () => {
  engine.resize();
  material.setFloat('uScreenH', engine.getRenderHeight());
  sizeInk();
  dirty = true;
});

/* =========================================================================
   INK: rivers, roads, towns and names on a 2D canvas, projected through the camera
   ========================================================================= */
const inkCanvas = document.getElementById('ink');
const ink = inkCanvas.getContext('2d');
const INK_DPR = Math.min(2, window.devicePixelRatio || 1);
const INK = '#2b2824';
const ROAD_RED = '#a3412c';
const RIVER_INK = '#2f6aa3';
let VP = null;

/** Sizes the ink canvas to the screen. */
function sizeInk() {
  inkCanvas.width = Math.round(innerWidth * INK_DPR);
  inkCanvas.height = Math.round(innerHeight * INK_DPR);
}
sizeInk();

// clip space w (the depth along the view, km) below which a point counts as behind the camera: points are cut there
// before the perspective divide, which would flip them
const W_NEAR = 0.5;

/** Map metres to clip space, as [cx, cy, cw], through the camera's view and projection, on the raised map. */
function toClip(x, z) {
  const m = VP;
  const X = x / 1000;
  const Y = riseAt(x, z);
  const Z = z / 1000;
  return [
    X * m[0] + Y * m[4] + Z * m[8] + m[12],
    X * m[1] + Y * m[5] + Z * m[9] + m[13],
    X * m[3] + Y * m[7] + Z * m[11] + m[15],
  ];
}

/** A clip-space point in front of the camera to CSS pixels on screen. */
function clipToScreen([cx, cy, cw]) {
  return [((cx / cw) * 0.5 + 0.5) * innerWidth, (0.5 - (cy / cw) * 0.5) * innerHeight];
}

/** The clip-space point where the segment a–b crosses w = W_NEAR. */
function nearCut(a, b) {
  const t = (W_NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, W_NEAR];
}

/** Map metres to CSS pixels on screen, or null for a point behind the camera. */
function toScreen(x, z) {
  const c = toClip(x, z);
  return c[2] < W_NEAR ? null : clipToScreen(c);
}

/** Screen pixels per km at the screen's centre. */
function pxPerKm() {
  const c = groundAt(innerWidth / 2, innerHeight / 2) || [view.x, view.z];
  const a = toScreen(c[0] * 1000, c[1] * 1000);
  const b = toScreen(c[0] * 1000 + 1000, c[1] * 1000);
  return a && b ? Math.hypot(b[0] - a[0], b[1] - a[1]) : 1;
}

/**
 * A flat [x, z, ...] line in metres, projected to screen: a list of runs of screen points, the line cut where it
 * passes behind the camera.
 */
function screenLine(p) {
  const runs = [];
  let run = [];
  let prev = null;
  for (let k = 0; k < p.length; k += 2) {
    const c = toClip(p[k], p[k + 1]);
    const inFront = c[2] >= W_NEAR;
    if (prev && inFront !== prev[2] >= W_NEAR) {
      run.push(clipToScreen(nearCut(prev, c)));
      if (!inFront) {
        runs.push(run);
        run = [];
      }
    }
    if (inFront) run.push(clipToScreen(c));
    prev = c;
  }
  if (run.length) runs.push(run);
  return runs.filter(r => r.length >= 2);
}

/** Traces screen points as a path on the ink canvas. */
function tracePoints(pts) {
  ink.beginPath();
  pts.forEach(([sx, sy], k) => (k ? ink.lineTo(sx, sy) : ink.moveTo(sx, sy)));
}

/** Traces runs of screen points as one path of separate lines. */
function traceRuns(runs) {
  ink.beginPath();
  for (const run of runs) run.forEach(([sx, sy], k) => (k ? ink.lineTo(sx, sy) : ink.moveTo(sx, sy)));
}

/** The frame, cut at the camera plane (Sutherland–Hodgman on w = W_NEAR), as screen points. */
function frameOnScreen() {
  const corners = [
    [-halfX, -halfZ],
    [halfX, -halfZ],
    [halfX, halfZ],
    [-halfX, halfZ],
  ].map(([x, z]) => toClip(x, z));
  const out = [];
  corners.forEach((c, k) => {
    const prev = corners[(k + corners.length - 1) % corners.length];
    const inFront = c[2] >= W_NEAR;
    if (inFront !== prev[2] >= W_NEAR) out.push(clipToScreen(nearCut(prev, c)));
    if (inFront) out.push(clipToScreen(c));
  });
  return out;
}

/** Width of a river line in CSS pixels, by its rank (lower is bigger) and the zoom; 0 when hidden. */
function riverWidth(rank, ppk) {
  const base = rank <= 2 ? 2.4 : rank <= 4 ? 1.7 : rank <= 6 ? 1.15 : 0.8;
  const show = rank <= 4 ? 0 : rank <= 6 ? 0.6 : 1.4;
  if (ppk < show) return 0;
  return base * clamp(0.7 + ppk * 0.12, 0.7, 1.8);
}

/** Rivers as fine blue-grey ink, widening with their rank; `screen` holds each shown river's runs of screen points. */
function drawRivers(ppk, screen) {
  ink.lineJoin = 'round';
  ink.lineCap = 'round';
  ink.strokeStyle = RIVER_INK;
  T.rivers.forEach((r, k) => {
    const w = riverWidth(r.rank, ppk);
    if (!w) return;
    screen[k] = screenLine(r.p);
    ink.lineWidth = w;
    ink.globalAlpha = 0.85;
    traceRuns(screen[k]);
    ink.stroke();
  });
  ink.globalAlpha = 1;
}

/** Roads in red ink: high roads solid, country roads thinner and dashed; a pale casing so they sit on the relief. */
function drawRoads(ppk) {
  const scale = clamp(0.75 + ppk * 0.1, 0.75, 1.7);
  ink.lineJoin = 'round';
  ink.lineCap = 'round';
  const lines = T.roads.map(r => screenLine(r.p));
  for (const pass of ['casing', 'ink']) {
    T.roads.forEach((r, k) => {
      const high = r.kind === 'high';
      traceRuns(lines[k]);
      if (pass === 'casing') {
        ink.setLineDash([]);
        ink.strokeStyle = 'rgba(250, 248, 242, 0.6)';
        ink.lineWidth = (high ? 3.6 : 2.6) * scale;
      } else {
        ink.setLineDash(high ? [] : [5 * scale, 3.5 * scale]);
        ink.strokeStyle = ROAD_RED;
        ink.lineWidth = (high ? 1.5 : 1.0) * scale;
      }
      ink.stroke();
    });
  }
  ink.setLineDash([]);
}

// the zoom (screen pixels per km) from which a town of each size is shown
const TOWN_SHOW = { 4: 0, 3: 0.75, 2: 1.3, 1: 2.2 };

/** Towns as dark blocks sized by importance, a fortress ringed; their names placed so none overlap. */
function drawTowns(ppk, placed) {
  const towns = D.towns.filter(t => ppk >= TOWN_SHOW[t.size]).sort((a, b) => b.size - a.size);
  for (const t of towns) {
    const at = toScreen(...T.towns[t.id]);
    if (!at) continue;
    const [sx, sy] = at;
    const s = [0, 2.6, 3.4, 4.4, 5.6][t.size] * clamp(0.85 + ppk * 0.05, 0.85, 1.3);
    ink.fillStyle = INK;
    ink.fillRect(sx - s / 2, sy - s / 2, s, s);
    if (t.fort) {
      ink.strokeStyle = INK;
      ink.lineWidth = 1;
      ink.beginPath();
      ink.moveTo(sx, sy - s * 1.15);
      ink.lineTo(sx + s * 1.15, sy);
      ink.lineTo(sx, sy + s * 1.15);
      ink.lineTo(sx - s * 1.15, sy);
      ink.closePath();
      ink.stroke();
    }
    const big = t.size >= 3;
    const px = big ? 15 + t.size * 1.5 : 13 + t.size;
    ink.font = `400 ${px}px "Instrument Serif", Georgia, serif`;
    ink.letterSpacing = big ? '0.12em' : '0.02em';
    const text = big ? t.name.toUpperCase() : t.name;
    const w = ink.measureText(text).width;
    // try right, left, above, below; skip the name if every place is taken
    const spots = [
      [sx + s + 4, sy + px * 0.32],
      [sx - s - 4 - w, sy + px * 0.32],
      [sx - w / 2, sy - s - 5],
      [sx - w / 2, sy + s + px * 0.8],
    ];
    for (const [lx, ly] of spots) {
      const box = [lx - 2, ly - px * 0.8, w + 4, px * 1.05];
      if (placed.some(b => overlaps(b, box))) continue;
      placed.push(box, [sx - s, sy - s, 2 * s, 2 * s]);
      haloText(text, lx, ly, big ? INK : '#3a3630');
      break;
    }
  }
  ink.letterSpacing = '0px';
}

/** Whether two [x, y, w, h] boxes overlap. */
function overlaps(a, b) {
  return a[0] < b[0] + b[2] && b[0] < a[0] + a[2] && a[1] < b[1] + b[3] && b[1] < a[1] + a[3];
}

/** Text with a soft paper halo, so it reads over the relief and the ink. */
function haloText(text, x, y, colour) {
  ink.lineJoin = 'round';
  ink.strokeStyle = 'rgba(246, 243, 235, 0.85)';
  ink.lineWidth = 3;
  ink.strokeText(text, x, y);
  ink.fillStyle = colour;
  ink.fillText(text, x, y);
}

/**
 * River names in serif italic, once per river, along the middle of its longest run on screen; `screen` holds the
 * runs of screen points drawRivers projected.
 */
function drawRiverNames(ppk, placed, screen) {
  const best = new Map();
  for (const [k, r] of T.rivers.entries()) {
    if (!screen[k] || !r.name || r.rank > (ppk > 1.5 ? 8 : 4)) continue;
    const name = r.name.replace(/^Rhein$|^Rhin$/, 'Rhine').replace(/^Donau$/, 'Danube');
    for (const pts of screen[k]) {
      let len = 0;
      for (let i = 1; i < pts.length; i++) {
        if (onScreen(pts[i])) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      }
      if (len > 160 && len > (best.get(name)?.len ?? 0)) best.set(name, { pts, len });
    }
  }
  ink.font = 'italic 400 16px "Instrument Serif", Georgia, serif';
  ink.letterSpacing = '0.08em';
  for (const [name, { pts }] of best) {
    // the on-screen point nearest the middle of the visible length
    const on = pts.filter(onScreen);
    const mid = on[Math.floor(on.length / 2)];
    const k = pts.indexOf(mid);
    const a = pts[Math.max(0, k - 2)];
    const b = pts[Math.min(pts.length - 1, k + 2)];
    let ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    if (ang > Math.PI / 2) ang -= Math.PI;
    if (ang < -Math.PI / 2) ang += Math.PI;
    const w = ink.measureText(name).width;
    const box = [mid[0] - w / 2, mid[1] - 14, w, 16];
    if (placed.some(p => overlaps(p, box))) continue;
    placed.push(box);
    ink.save();
    ink.translate(mid[0], mid[1]);
    ink.rotate(ang);
    haloText(name, -w / 2, -5, '#24578a');
    ink.restore();
  }
  ink.letterSpacing = '0px';
}

/** Whether a screen point lies on the screen, with a margin. */
function onScreen([x, y]) {
  return x > 20 && y > 20 && x < innerWidth - 20 && y < innerHeight - 20;
}

/** Region names letter-spaced across the land, anchored to the map, fading as the camera closes in. */
function drawRegions(ppk) {
  const alpha = 0.5 * (1 - sstep(2.2, 4, ppk));
  if (alpha <= 0.01) return;
  const px = clamp(ppk * 22, 13, 46);
  ink.font = `400 ${px}px "Instrument Serif", Georgia, serif`;
  ink.letterSpacing = `${(px * 0.55).toFixed(1)}px`;
  ink.globalAlpha = alpha;
  ink.fillStyle = '#4a4238';
  D.regions.forEach((r, k) => {
    const at = toScreen(...T.regions[k]);
    if (!at) return;
    const [sx, sy] = at;
    ink.save();
    ink.translate(sx, sy);
    ink.rotate((-r.angle * Math.PI) / 180);
    ink.textAlign = 'center';
    ink.fillText(r.name, 0, px * 0.35);
    ink.restore();
  });
  ink.globalAlpha = 1;
  ink.letterSpacing = '0px';
  ink.textAlign = 'left';
}

/** The scale bar: a round number of km about 120 px long at the screen's centre. */
function drawScale(ppk) {
  const km = [5, 10, 20, 25, 50, 100, 200].find(k => k * ppk >= 90) || 200;
  document.getElementById('scaleBar').style.width = Math.round(km * ppk) + 'px';
  document.getElementById('scaleText').textContent = km + ' km';
}

/** Redraws the ink for the current camera. */
function drawInk() {
  VP = scene.getTransformMatrix().m;
  ink.setTransform(INK_DPR, 0, 0, INK_DPR, 0, 0);
  ink.clearRect(0, 0, innerWidth, innerHeight);
  const ppk = pxPerKm();
  // the shade's strength by the zoom (screen pixels per km): SHADE_FAR over the whole theatre, full from about 3
  material.setFloat('uShadeK', lerp(SHADE_FAR, 1, sstep(0.9, 3, ppk)));
  // the real heights for the contours and sheets only well in, from about 10 px a km (a 250 m bump 2.5 px): further
  // out their small bumps cross the sheet levels and dot the map with tiny rings
  material.setFloat('uNearK', sstep(10, 24, ppk));
  // the light's real detail from under 1 px a km, full from 3
  material.setFloat('uDetailK', sstep(0.6, 3, ppk));
  material.setFloat('uFineK', sstep(2, 6, ppk));
  // the sheets from about 2 px a km: further out they speckle the plains
  material.setFloat('uSheetK', sstep(1.6, 4, ppk));
  material.setFloat('uContourK', sstep(1.2, 3, ppk));
  const placed = [];
  // the ink stops at the neatline, as the print does
  ink.save();
  tracePoints(frameOnScreen());
  ink.clip();
  // each shown river's screen points, projected once for its line and its name
  const rivers = [];
  drawRegions(ppk);
  drawRivers(ppk, rivers);
  drawRoads(ppk);
  drawTowns(ppk, placed);
  drawRiverNames(ppk, placed, rivers);
  ink.restore();
  drawScale(ppk);
}

   START
   ========================================================================= */
document.getElementById('meta').innerHTML =
  `Lambert equal-area ${lat0}° N ${lon0}° E · ${NX - 1} × ${NZ - 1} cells of ${CELL} m<br>` +
  `relief ×${RELIEF_Z} for the light · sun ${RELIEF_SUN}° from the north-west<br>` +
  `${D.towns.length} towns · ${T.roads.length} roads, routed over the heights`;
document.getElementById('credit').textContent = T.credit;

placeCamera();
// the print every frame (cheap on the GPU, and safe while its shader compiles in the background: drawing only on a
// change left an empty frame in a visible Chrome); the ink only when the view changed
engine.runRenderLoop(() => {
  material.setFloat('uTime', performance.now() / 1000);
  scene.render();
  if (!dirty) return;
  drawInk();
  dirty = false;
});

/**
 * Renders n frames back to back, waiting for the GPU after each, and returns the mean in ms. With `withInk`, the ink
 * is redrawn every frame too, as while panning; without, as when the camera stands still.
 */
function bench(n = 60, withInk = true) {
  const gl = engine._gl;
  const px = new Uint8Array(4);
  const start = performance.now();
  for (let k = 0; k < n; k++) {
    scene.render();
    if (withInk) drawInk();
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  }
  return (performance.now() - start) / n;
}

window.__proto = {
  view: () => ({ ...view }),
  setView(x, z, dist) {
    Object.assign(view, { x, z, dist });
    placeCamera();
  },
  bench,
};
/**
 * Loads the focus windows' finer heights (files beside the theatre's, written by tools/campaign-theatre.ts) after the
 * first frame, and binds each one's detail to a slot of the print shader. A window that does not load is skipped.
 */
function loadFineWindows() {
  if (!window.__theatreUrl || !Array.isArray(T.focus)) return;
  window.__fineLoaded = 0;
  T.focus.slice(0, FINE_SLOTS.length).forEach((focus, k) => {
    if (!/^[\w.-]+\.js$/.test(focus.file)) return;
    const script = document.createElement('script');
    script.src = new URL(focus.file, window.__theatreUrl).href;
    script.onload = () => {
      const win = window.THEATRE_FINE && window.THEATRE_FINE[focus.name];
      if (!win) return;
      const slot = FINE_SLOTS[k];
      const x1 = win.x0 + (win.nx - 1) * win.cell;
      const z1 = win.z0 + (win.nz - 1) * win.cell;
      material.setTexture('uFine' + slot, fineDetailTexture(win));
      material.setVector4('uFineRect' + slot, new B.Vector4(win.x0 / 1000, win.z0 / 1000, x1 / 1000, z1 / 1000));
      material.setVector2('uFineTexel' + slot, new B.Vector2(1 / win.nx, 1 / win.nz));
      material.setFloat('uFineCellKm', win.cell / 1000);
      window.__fineLoaded++;
      dirty = true;
    };
    script.onerror = () => console.warn('campaign map: the finer heights of ' + focus.name + ' did not load');
    document.head.appendChild(script);
  });
}

// both faces: the river names are italic
Promise.allSettled([
  document.fonts.load('16px "Instrument Serif"'),
  document.fonts.load('italic 16px "Instrument Serif"'),
]).then(() => {
  loadFineWindows();
  dirty = true;
  window.__readyMs = Math.round(performance.now() - t0);
});
</script>
