# Every PR and every push to main: lint, types, generated data, docs, tests with coverage, build.
# The cost tests skip themselves when CI is set (shared runners are too noisy for millisecond budgets).
# tools/app-check.mjs (headless browser) is not run here yet.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:data
      - run: npm run check:docs
      - run: npm run coverage
      - run: npm run build
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
