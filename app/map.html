<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map</title>
<style>
  :root { --paper: #f3efe6; --ink: #211f1c; --ink-2: #5f5a52; --ink-3: #a19a8f; --rule: rgba(40, 30, 20, .14); --bad: #9a2a1a;
          --mono: ui-monospace, Menlo, monospace; --display: system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ddd6c6; color: var(--ink); font: 400 12px/1.45 var(--mono); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #map { cursor: grab; }
  #map:active { cursor: grabbing; }
  .card { position: fixed; padding: 12px 14px; background: rgba(246, 243, 236, .95); border: 1px solid var(--rule); border-radius: 4px; }
  #panel { top: 16px; left: 16px; width: 300px; }
  #panel .t { font: 700 20px/1 var(--display); margin-bottom: 8px; }
  #status { color: var(--ink-2); font-size: 11px; margin: 6px 0; }
  label { margin-right: 12px; color: var(--ink-2); }
  select { font: inherit; }
  #errbox { margin-top: 8px; color: var(--bad); }
  #errbox .cap { font-weight: 700; }
  #errors { margin: 4px 0 0; padding-left: 16px; max-height: 40vh; overflow: auto; }
  #readout { bottom: 16px; left: 16px; white-space: pre; min-width: 260px; }
  #readout:empty { display: none; }
  @media (max-width: 640px) { #panel { left: 8px; right: 8px; width: auto; } }
</style>
</head>
<body>
<canvas id="lit"></canvas>
<canvas id="map"></canvas>
<div id="panel" class="card">
  <div class="t">Map</div>
  <select id="picker" aria-label="Map"></select>
  <div id="status">compiling…</div>
  <label>view <select id="mode"><option value="lit">lit</option><option value="flat">flat colours</option></select></label>
  <label><input id="outlines" type="checkbox" checked> outlines</label>
  <label><input id="ids" type="checkbox" checked> ids</label>
  <div id="errbox" hidden><div class="cap">The file has errors; the last good drawing stays.</div><ul id="errors"></ul></div>
</div>
<div id="readout" class="card"></div>
<script type="module" src="../src/app/map/main.ts"></script>
</body>
</html>
