<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff map</title>
<style>
  :root { --paper: #f3efe6; --ink: #211f1c; --ink-2: #5f5a52; --ink-3: #a19a8f; --rule: rgba(40, 30, 20, .14);
          --mono: ui-monospace, Menlo, monospace; --display: system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8e1d3; color: var(--ink); font: 400 12px/1.45 var(--mono); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #units { cursor: crosshair; touch-action: none; }
  #panel { position: fixed; top: 16px; right: 16px; width: 262px; padding: 14px 14px 12px; background: rgba(246, 243, 236, .95);
           border: 1px solid var(--rule); border-radius: 4px; }
  #panel .t { font: 700 24px/1 var(--display); letter-spacing: -.01em; margin-bottom: 2px; }
  #panel .m { font-size: 10px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
  .cap { font: 500 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 12px 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; }
  button { font: 400 10.5px/1 var(--mono); color: var(--ink-2); background: none; border: 1px solid rgba(40, 30, 20, .26); border-radius: 999px; padding: 5px 9px; cursor: pointer; }
  button:hover { color: var(--ink); border-color: var(--ink-2); }
  button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button:disabled { opacity: .35; cursor: default; }
  #stats { white-space: pre; font-size: 10.5px; color: var(--ink-2); line-height: 1.55; }
  #box { position: fixed; border: 1px dashed var(--ink-2); background: rgba(44, 79, 168, .06); pointer-events: none; display: none; }
  #scale { position: fixed; left: 22px; bottom: 26px; pointer-events: none; }
  #north { position: fixed; left: 26px; top: 24px; font: 500 10px/1 var(--mono); color: var(--ink-2); text-align: center; pointer-events: none; }
  #hint { position: fixed; left: 16px; bottom: 4px; padding: 2px 6px; font-size: 10px; color: var(--ink-3); background: rgba(243, 239, 230, .9); pointer-events: none; }
</style>
</head>
<body>
<canvas id="map"></canvas>
<canvas id="units"></canvas>
<div id="box"></div>
<div id="north"><svg width="12" height="18" viewBox="0 0 12 18"><path d="M6 1 L10 16 L6 12.5 L2 16 Z" fill="none" stroke="#211f1c" stroke-width="1"/></svg><div>N</div></div>
<div id="scale"><svg id="scalebar" width="140" height="22"></svg></div>
<div id="hint">click a battalion to select (shift adds) · drag to box-select · click the ground to march · right-drag or space-drag to pan · scroll to zoom · P pause · M marks a moment for the playtest</div>
<div id="panel">
  <div class="t">Staff map</div>
  <div class="m" id="sub">S1c · fire and morale</div>
  <div class="cap">Formation</div>
  <div class="row" id="shapes"></div>
  <div class="cap">Orders</div>
  <div class="row">
    <button data-cmd="face">Face about</button><button data-cmd="retire">Retire 30 m</button>
    <button data-cmd="wheelL">Wheel left</button><button data-cmd="wheelR">Wheel right</button><button data-cmd="halt">Halt</button>
    <button data-cmd="fireAtWill">Fire at will</button><button data-cmd="holdFire">Hold fire</button><button id="charge" title="then click the enemy">Charge (C)</button>
  </div>
  <div class="cap">Order style</div>
  <div class="row" id="styles"></div>
  <div class="cap">Time · view</div>
  <div class="row" id="speeds"></div>
  <div class="row" style="margin-top:4px"><button data-view="slots">Slots</button><button data-view="replay">Save session</button></div>
  <div class="cap">Readout</div>
  <div id="stats"></div>
</div>
<script type="module" src="/src/app/main.ts"></script>
</body>
</html>
