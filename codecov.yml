# Coverage is reported, not enforced: the statuses inform and never fail a PR.
# CI's coverage job runs in five shards, each uploading its part: Codecov reports once all five are in.
codecov:
  notify:
    after_n_builds: 5
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment:
  layout: "diff, files"
  require_changes: true
  after_n_builds: 5
